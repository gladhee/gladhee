name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 17 * * *'

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the source language classifier
        working-directory: scripts/langdetect
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/profile-langdetect" .
      - name: Refresh activity and authored language statistics
        env:
          GH_TOKEN: ${{ github.token }}
          LANGDETECT_BIN: ${{ runner.temp }}/profile-langdetect
          WORK_LANGUAGE_SNAPSHOT: ${{ secrets.WORK_LANGUAGE_SNAPSHOT }}
        run: python3 scripts/profile_stats.py
      - name: Publish refreshed cards
        run: |
          if git diff --quiet -- README.md assets/activity.svg assets/languages.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/activity.svg assets/languages.svg
          git commit -m 'Refresh public GitHub activity and language stats'
          git push
